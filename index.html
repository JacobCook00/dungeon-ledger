<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dungeon Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Dungeon Ledger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Dungeon Ledger</h1><span id="status"></span></header>
<main id="view"></main>

<div id="cmdbar" hidden>
  <div id="pending"></div>
  <form class="row" data-submit="cmd">
    <input id="cmd" placeholder="goblin 2 takes 8, next turn" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Session update">
    <button type="button" class="btn icon" id="mic" data-a="mic" hidden aria-label="Dictate">🎙</button>
    <button class="btn primary icon" aria-label="Parse update">➤</button>
  </form>
</div>

<nav>
  <button data-a="tab" data-id="dice"><span>🎲</span>Dice</button>
  <button data-a="tab" data-id="session"><span>⚔️</span>Session</button>
  <button data-a="tab" data-id="chars"><span>📜</span>Characters</button>
</nav>

<dialog id="sheet"></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="dice.js"></script>
<script src="tracker.js"></script>
<script src="app.js"></script>
</body>
</html>
